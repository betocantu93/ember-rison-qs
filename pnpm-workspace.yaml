# the addon is the root; docs/ is its site (a playground and guides)
packages:
  - docs

allowBuilds:
  esbuild: false

# Docs: https://pnpm.io/settings
# https://github.com/emberjs/rfcs/pull/907

# we don't want addons to be bad citizens of the ecosystem
autoInstallPeers: false

# we want true isolation,
# if a dependency is not declared, we want an error
resolvePeersFromWorkspaceRoot: false

# Keep native binaries (rollup, esbuild...) for both macOS and Linux: the same
# node_modules is used from a Mac and from a Linux container, and an install
# on one must not remove the other's.
supportedArchitectures:
  os: [current, darwin, linux]
  cpu: [current]
  libc: [current, glibc]

# tmp < 0.2.6 has path traversal (GHSA-ph9p-34f9-6g65). Old broccoli-era
# packages under @embroider/compat (external-editor, can-symlink) still ask
# for 0.0.x; both only call tmp.tmpNameSync, which 0.2 keeps.
overrides:
  tmp: ^0.2.6
